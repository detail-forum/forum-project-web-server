spring.application.name=api_practice
server.port=8081

# 로컬 비밀값은 저장소에 넣지 않는다. 실행 디렉터리의 application-local.properties 또는 환경 변수로 넣는다.
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/2025_gbsw_spring}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# 32바이트 이상. 기존 세션을 유지하려면 이전에 쓰던 값과 같아야 한다.
spring.jwt.secret=${JWT_SECRET}

# Swagger (SpringDoc OpenAPI) 설정
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# 파일 업로드 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

logging.level.org.springframework.security=INFO

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.properties.hibernate.hbm2ddl.auto=update

# 업로드 디렉토리 설정 (Windows 경로)
app.upload.dir=C:/app-data/uploads
app.upload.max-size=10485760

# 이메일 발송 설정 (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 애플리케이션 기본 URL (이메일 인증 링크에 사용)
app.base-url=https://forum.rjsgud.com

# HTTPS 배포에서는 true. 로컬 HTTP는 false.
app.cookie.secure=${APP_COOKIE_SECURE:false}

# Spring MVC 설정
# 핸들러를 찾을 수 없을 때 예외 발생 (정적 리소스 핸들러보다 컨트롤러 매핑 우선)
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
